[project]
name = "insightforge"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "adzbharadwaj", email = "adityabharadwaj@live.in" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "deepagents>=0.7.28",
    "docling>=2.140.0",
    "fastapi>=0.115",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.12",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.5.0",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
insightforge = "insightforge.cli:main"
insightforge-scheduler = "insightforge.watchlist.scheduler:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
